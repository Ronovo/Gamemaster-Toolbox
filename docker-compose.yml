#   docker compose up -d      then open http://localhost:9000
#   docker compose down       stop it; your data stays

# Fixed so the volume has the same name whatever folder the repo was cloned into.
name: gm-toolbox

services:
  gm-toolbox:
    build: .
    image: gm-toolbox
    container_name: gm-toolbox

    ports:
      # Reachable from the whole network; use "127.0.0.1:9000:8080" to keep it to this machine.
      - "9000:8080"

    volumes:
      # A named volume, not a host folder: it inherits the app user's ownership of /app/App_Data.
      - gmtoolbox-data:/app/App_Data

    restart: unless-stopped

volumes:
  gmtoolbox-data:
